<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigaChat3 Web Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Боковая панель с настройками -->
            <div class="col-md-3 bg-light border-end p-3">
                <h4 class="mb-4">Настройки</h4>
                
                <div class="mb-3">
                    <label for="systemPrompt" class="form-label">Системный промпт</label>
                    <select class="form-select" id="systemPrompt">
                        <option value="assistant" selected>Помощник</option>
                        <option value="coder">Кодер</option>
                        <option value="analyst">Аналитик ТЗ</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="temperature" class="form-label">
                        Temperature: <span id="temperatureValue">0.7</span>
                    </label>
                    <input type="range" class="form-range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                </div>

                <div class="mb-3">
                    <label for="maxTokens" class="form-label">Max Tokens</label>
                    <input type="number" class="form-control" id="maxTokens" min="1" max="4096" value="512">
                </div>

                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="streaming" checked>
                        <label class="form-check-label" for="streaming">Потоковая генерация</label>
                    </div>
                </div>

                <div class="mb-3">
                    <button class="btn btn-secondary w-100" id="resetBtn">Новый диалог</button>
                </div>

                <div class="mb-3">
                    <button class="btn btn-outline-primary w-100" id="saveBtn">Сохранить историю</button>
                </div>

                <div class="mb-3">
                    <input type="file" class="form-control" id="loadFile" accept=".json" style="display: none;">
                    <button class="btn btn-outline-secondary w-100" id="loadBtn">Загрузить историю</button>
                </div>

                <hr>

                <div id="metrics" class="small text-muted">
                    <div>Метрики:</div>
                    <div id="tokensPerSecond">-</div>
                    <div id="tokensUsed">-</div>
                </div>
            </div>

            <!-- Основная область чата -->
            <div class="col-md-9 d-flex flex-column h-100">
                <div class="header p-3 border-bottom">
                    <h3>GigaChat3-10B Web Interface</h3>
                    <div class="small text-muted" id="status">Статус: Проверка...</div>
                </div>

                <div class="chat-area flex-grow-1 p-3" id="chatArea">
                    <div class="welcome-message text-center text-muted">
                        <p>Добро пожаловать! Начните диалог, отправив сообщение.</p>
                    </div>
                </div>

                <div class="input-area p-3 border-top">
                    <div class="input-group">
                        <textarea 
                            class="form-control" 
                            id="messageInput" 
                            rows="2" 
                            placeholder="Введите ваше сообщение..."
                            style="resize: none;"
                        ></textarea>
                        <button class="btn btn-primary" id="sendBtn" type="button">Отправить</button>
                    </div>
                    <div class="mt-2">
                        <div class="spinner-border spinner-border-sm d-none" id="loadingSpinner" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                        <span class="text-muted small" id="statusText"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
