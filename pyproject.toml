[tool.ruff]
target-version = "py312"
line-length = 100
preview = true

# ВКЛЮЧАЕМ ВСЕ ПРАВИЛА, ПОТОМ ТОЧНО НАСТРАИВАЕМ
[tool.ruff.lint]
select = ["ALL"]
# СИСТЕМНЫЕ ИСКЛЮЧЕНИЯ
ignore = [
    "CPY001",  # copyright (есть в лицензии проекта)
    "N999",  # alembic migrations
]

# === ТОЛЬКО ДЛЯ ТЕСТОВ ===
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001"]  # assert разрешен только в тестах, неисп.аргументы фикстур
"*/tests/**" = ["S101", "ARG001"]
"**/test_*.py" = ["S101", "ARG001"]

# === ОСОБЫЕ СЛУЧАИ (требуют approval сеньора) ===
# Для этих правил ВСЕГДА пиши TODO с пояснением:
# "ANN401" = true  # Any в аргументах - ТРЕБУЕТСЯ ОБОСНОВАНИЕ В КОДЕ!
# "TRY003" = true  # длинные сообщения исключений - РАЗРЕШАТЬ ПО ОСОБОЙ ПРИЧИНЕ

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true  # единый стиль для всего
indent-style = "space"
skip-magic-trailing-comma = false  # всегда trailing comma для multiline

# 🧠 РАСШИРЕННЫЕ ПРОВЕРКИ
[tool.ruff.lint.flake8-bugbear]
# Детектор потенциальных багов - ВСЕГДА ВКЛЮЧЕН
extend-immutable-calls = ["FrozenConfig", "ImmutableDict"]

[tool.ruff.lint.flake8-comprehensions]
# Оптимизация comprehensions

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false
parametrize-names-type = "csv"
raises-require-match-for = ["pytest.raises"]

[tool.ruff.lint.perflint]
# Проверка производительности
enabled = true

[tool.ruff.lint.pyupgrade]
# Автоматическая модернизация синтаксиса
keep-runtime-typing = false

[tool.ruff.lint.ruff]
# Дополнительные правила Ruff
allow-pydantic-aliases = false  # строгая типизация Pydantic

# БЕЗОПАСНОСТЬ: Максимально строгий линтинг для поиска уязвимостей
[tool.bandit]
exclude_dirs = ['tests', 'build', 'dist', '*.egg-info', 'migrations', 'alembic', 'docs', 'venv', '.venv']

# 1. СНИЖАЕМ "ШУМ": Отключаем проверки, наименее релевантные для веб-приложения.
skips = [
    'B101',  # assert_used - Ruff уже проверяет S101, а в тестах assert нужен.
    'B104',  # hardcoded_bind_all_interfaces - В FastAPI хост/порт обычно задаются через переменные окружения (в `main.py`). Если у вас иначе, уберите этот пункт!
    'B311',  # random - Используется для генерации тестовых данных, не для криптографии.
]

# 2. ПОВЫШАЕМ СТРОГОСТЬ: Включаем дополнительные плагины.
tests = ['B201', 'B301']  # Явно проверяем flask_debug_true и pickle.

# 3. ФОКУС НА FASTAPI: Конкретные настройки для типичных уязвимостей.
[tool.bandit.checks]
# Считаем `json.loads` безопасным, только если данные валидируются Pydantic.
ConsiderGenericException = true

[tool.bandit.subprocess_without_shell_equals_true]
# Если в проекте используются subprocesses (например, для вызова системных утилит),
# добавьте сюда функции-обёртки, которые гарантированно не используют shell.
# functions = ['my_safe_runner']